name: Core quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/server/package-lock.json
            apps/web/package-lock.json
      - name: Verify public source before installing dependencies
        run: node scripts/release/verify-public.mjs
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/server
          npm ci --prefix apps/web
      - name: Quality, tests, and build
        run: npm run quality:check
      - name: Linux installer checks
        run: |
          npm run test:install
          npm run test:release:shell
      - name: Verify deployment packet and Compose configuration
        env:
          YEEN_ENV_FILE: .env.example
        run: |
          node scripts/prepare-deploy.mjs
          node scripts/create-zip.mjs
          docker compose -f deploy/deployment/docker/compose.yml -f deploy/deployment/docker/compose.local-build.yml config --quiet
          docker build --check -f deploy/deployment/docker/Dockerfile deploy
