name: Core release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/server/package-lock.json
            apps/web/package-lock.json

      - name: Use Java 21 for Android
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve release identity
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/server
          npm ci --prefix apps/web

      - name: Verify Core contains no Downloader implementation
        run: npm run verify:core-only

      - name: Test release tooling
        run: |
          command -v zip
          npm run android:test
          npm run android:audit
          npm run test:release
          npm run test:release:shell
          npm run test:install
          bash -n deployment/scripts/install-release.sh
          bash -n deployment/scripts/install-github-release.sh

      - name: Test server and web
        run: |
          npm --prefix apps/server test -- --runInBand
          npm --prefix apps/web test -- --run

      - name: Lint
        run: |
          npm --prefix apps/server run lint
          npm --prefix apps/web run lint
          git diff --exit-code

      - name: Code quality gate
        run: npm run codefactor:check

      - name: Build Core deployment archive
        run: npm run build:zip

      - name: Build and inspect Android debug APK
        shell: bash
        run: |
          yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          npm run android:configure-sdk
          npm --prefix apps/web exec -- cap sync android
          chmod +x apps/web/android/gradlew
          apps/web/android/gradlew \
            --project-dir apps/web/android \
            --no-daemon testDebugUnitTest lintDebug assembleDebug
          mkdir -p artifacts/android
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/android/yeen-android-debug-${RELEASE_TAG}.apk"

      - name: Build signed Android release APK
        if: >-
          github.event_name == 'push' &&
          secrets.YEEN_ANDROID_KEYSTORE_BASE64 != '' &&
          secrets.YEEN_ANDROID_KEYSTORE_PASSWORD != '' &&
          secrets.YEEN_ANDROID_KEY_ALIAS != '' &&
          secrets.YEEN_ANDROID_KEY_PASSWORD != ''
        shell: bash
        env:
          YEEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.YEEN_ANDROID_KEYSTORE_BASE64 }}
          YEEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YEEN_ANDROID_KEYSTORE_PASSWORD }}
          YEEN_ANDROID_KEY_ALIAS: ${{ secrets.YEEN_ANDROID_KEY_ALIAS }}
          YEEN_ANDROID_KEY_PASSWORD: ${{ secrets.YEEN_ANDROID_KEY_PASSWORD }}
        run: |
          signing_file="$RUNNER_TEMP/yeen-android-release.jks"
          trap 'rm -f "$signing_file"' EXIT
          umask 077
          printf '%s' "$YEEN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          export YEEN_ANDROID_KEYSTORE_PATH="$signing_file"
          node scripts/android/verify-release-signing.mjs
          apps/web/android/gradlew \
            --project-dir apps/web/android \
            --no-daemon assembleRelease
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/yeen-android-${RELEASE_TAG}.apk"
          sha256sum "artifacts/yeen-android-${RELEASE_TAG}.apk" \
            > "artifacts/yeen-android-${RELEASE_TAG}.apk.sha256"

      - name: Prepare checksummed release assets
        run: >-
          node scripts/release/prepare-github-release.mjs
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"

      - name: Validate portable Docker packet
        shell: bash
        env:
          YEEN_ENV_FILE: .env.example
        run: |
          docker compose \
            -f deploy/deployment/docker/compose.yml \
            -f deploy/deployment/docker/compose.local-build.yml \
            config --quiet
          docker build --check \
            -f deploy/deployment/docker/Dockerfile \
            deploy

      - name: Resolve container image name
        if: github.event_name == 'push'
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'YEEN_IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate container metadata
        if: github.event_name == 'push'
        id: container-metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.YEEN_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and publish multi-platform Core image
        if: github.event_name == 'push'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./deploy
          file: ./deploy/deployment/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
          provenance: true
          sbom: true

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeen-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/yeen-${{ env.RELEASE_TAG }}.zip
            artifacts/yeen-${{ env.RELEASE_TAG }}.zip.sha256
            artifacts/yeen-${{ env.RELEASE_TAG }}.release.json
            artifacts/android/yeen-android-debug-${{ env.RELEASE_TAG }}.apk
            artifacts/yeen-android-${{ env.RELEASE_TAG }}.apk
            artifacts/yeen-android-${{ env.RELEASE_TAG }}.apk.sha256

      - name: Publish immutable tag release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "artifacts/yeen-${RELEASE_TAG}.zip"
            "artifacts/yeen-${RELEASE_TAG}.zip.sha256"
            "artifacts/yeen-${RELEASE_TAG}.release.json"
          )
          if [[ -f "artifacts/yeen-android-${RELEASE_TAG}.apk" ]]; then
            assets+=(
              "artifacts/yeen-android-${RELEASE_TAG}.apk"
              "artifacts/yeen-android-${RELEASE_TAG}.apk.sha256"
            )
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Yeen $RELEASE_TAG" "${release_flags[@]}"
          fi
